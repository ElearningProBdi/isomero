<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ISOMERO - Permissions Final</title><style>body{font-family:system-ui;padding:20px;background:#f5f5f5}.card{background:#fff;padding:14px;border-radius:12px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.1)}button{padding:8px 12px;border-radius:8px;border:none;margin:3px;cursor:pointer;font-weight:600}.view{background:#e3f2fd}.edit{background:#fff8e1}.sell{background:#e8f5e9;border:1px solid #a5d6a7}.admin{background:#ffebee}#adminPanel{display:none;border:2px dashed red}</style></head><body>
<h2>ISOMERO - Permissions OK</h2>
<select id="roleSwitcher" onchange="CURRENT_USER.role=this.value;render()" style="padding:8px;border-radius:8px">
<option value="student">STUDENT - VIEW</option><option value="teacher">TEACHER - VIEW+CREATE+EDIT</option><option value="leader" selected>LEADER - VIEW+SELL ONLY</option><option value="admin">ADMIN - ALL</option>
</select> <span>Role: <b id="uRole"></b></span>
<div id="list"></div><div id="adminPanel" class="card"><h3>Admin: Assigner Role</h3><input id="tId" placeholder="user_id"><select id="tRole"><option value="teacher">teacher</option><option value="student">student</option><option value="leader">leader</option><option value="admin">admin</option></select><button class="admin" onclick="alert('Assign OK - admin only')">Assign</button></div>
<script src="subjects.js"></script>
<script>
let CURRENT_USER={id:'leader_01',name:'John',role:'leader',myCourses:['fr-a1-01']};
const canView=()=>true;
const canCreate=()=>['teacher','admin'].includes(CURRENT_USER.role);
const canEdit=(c)=> CURRENT_USER.role==='admin' || (CURRENT_USER.role==='teacher' && CURRENT_USER.myCourses.includes(c.id));
const canSell=()=>['leader','admin'].includes(CURRENT_USER.role);
const canAssign=()=>CURRENT_USER.role==='admin';
function render(){
 document.getElementById('uRole').innerText=CURRENT_USER.role.toUpperCase();
 document.getElementById('roleSwitcher').value=CURRENT_USER.role;
 document.getElementById('adminPanel').style.display=canAssign()?'block':'none';
 let h=canCreate()?'<button class="view" style="width:100%;padding:12px;margin-bottom:10px">+ CREATE COURSE</button>':'';
 if(CURRENT_USER.role==='leader') h+='<div class="card" style="background:#e8f5e9"><b>💰 MODE VENDEUR:</b> Tu peux vendre, pas éditer.</div>';
 for(let k in SUBJECTS){for(let lvl in SUBJECTS[k].levels){SUBJECTS[k].levels[lvl].forEach(c=>{
  h+=`<div class="card"><b>${SUBJECTS[k].icon} ${c.title}</b> <small>${c.id}</small><br><br><button class="view">VIEW</button>${canEdit(c)?'<button class="edit">EDIT</button>':''}${canSell()?'<button class="sell">💰 SELL</button>':''}${canAssign()?'<button class="admin">DELETE</button>':''}</div>`;
 });}} document.getElementById('list').innerHTML=h;
} render();
</script></body></html>
