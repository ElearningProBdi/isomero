<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISOMERO Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px;display:none}
.box{background:#fff;color:#000;padding:20px;border-radius:14px;max-width:600px;margin:auto}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;background:#0d6efd;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.user{background:#f1f5f9;padding:10px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<div class="box">
<h2>ISOMERO Admin</h2>
<p id="status">Checking...</p>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk",
  authDomain: "isomero-f6887.firebaseapp.com",
  projectId: "isomero-f6887",
  storageBucket: "isomero-f6887.firebasestorage.app",
  messagingSenderId: "669743420568",
  appId: "1:669743420568:web:3b478914e4cd1525cd2ced",
  measurementId: "G-0QJZTRLQPG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let myRole = null;
let myEmail = "";

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login-firebase.html";
    return;
  }
  const snap = await getDoc(doc(db, "users", user.uid));
  if(!snap.exists()){
    alert("⚠️ No role - Ask Super Admin");
    window.location.href = "app.html";
    return;
  }
  myRole = snap.data().role;
  myEmail = user.email;
  // ✅ FIXED: Allow super_admin AND admin - before it blocked super_admin
  if(myRole !== "admin" && myRole !== "super_admin"){
    window.location.href = "app.html";
    return;
  }
  document.body.style.display = "block";
  document.getElementById('status').innerHTML = '✅ Welcome ' + myRole + ': ' + user.email;
  const users = await getDocs(collection(db, "users"));
  let html = "";
  users.forEach(u => {
    const d = u.data();
    // ✅ FIXED: Admin cannot see/edit Super Admin
    if(d.role === "super_admin" && myRole !== "super_admin") return;
    // Build role options based on my power
    let options = `<option value="student" ${d.role=='student'?'selected':''}>student</option>
    <option value="teacher" ${d.role=='teacher'?'selected':''}>teacher</option>
    <option value="admin" ${d.role=='admin'?'selected':''}>admin</option>`;
    // Only Super Admin can assign super_admin
    if(myRole === "super_admin"){
      options += `<option value="super_admin" ${d.role=='super_admin'?'selected':''}>super_admin</option>`;
      options += `<option value="leader" ${d.role=='leader'?'selected':''}>leader</option>`;
    }
    html += `<div class="user"><b>${d.email || d.name || u.id}</b><br>Role: ${d.role || 'student'}<br>
    <select onchange="changeRole('${u.id}', this.value, '${d.role || ''}')">
    ${options}
    </select></div>`;
  });
  document.getElementById('list').innerHTML = html;
});

window.changeRole = async (uid, role, oldRole) => {
  // ✅ FIXED: Admin cannot promote to super_admin or touch super_admin
  if(myRole !== "super_admin" && (role === "super_admin" || oldRole === "super_admin")){
    alert("❌ Only Super Admin can do that");
    location.reload();
    return;
  }
  if(!confirm("Change role to " + role + "?")){ location.reload(); return; }
  await updateDoc(doc(db, "users", uid), { role: role });
  alert("Changed to " + role);
};
</script>
</body>
</html>
