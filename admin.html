<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOMERO - Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#0a0e1f;color:white;margin:0;padding:15px}
.box{max-width:900px;margin:auto}
h1{text-align:center;color:#ffcc00}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;background:#1e2540;color:white;min-width:110px}
.tabs button.active{background:#ffcc00;color:#000}
.roleFilter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.roleFilter button{padding:8px 12px;border:none;border-radius:99px;font-weight:800;cursor:pointer;background:#1e2540;color:white;font-size:12px}
.roleFilter button.active{background:#ffcc00;color:#000}
.card{background:white;color:#111;border-radius:14px;padding:14px;margin:10px 0}
.card b{font-size:15px}
.card p{margin:4px 0;color:#64748b;font-size:13px}
.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#fef9c3}
.pill.green{background:#dcfce7;color:#166534}
.pill.red{background:#fee2e2;color:#991b1b}
.pill.blue{background:#dbeafe;color:#1e40af}
.pill.purple{background:#e9d5ff;color:#6b21a8}
.pill.orange{background:#ffedd5;color:#9a3412}
.pill.pink{background:#fce7f3;color:#9d174d}
.pill.black{background:#e5e7eb;color:#111}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:15px;box-sizing:border-box}
button.main{width:100%;padding:14px;background:#ffcc00;color:#000;border:none;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0}
.stat div{background:#1e2540;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block;color:#ffcc00}
.stat span{font-size:12px;color:#cbd5e1}
</style>
</head>
<body>
<!-- FIREBASE AUTH LOCK - START -->
<div id="adminLock" style="position:fixed;inset:0;background:#0a0e1f;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:white;color:#111;border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center">
    <h2 style="margin:0">🔒 ISOMERO ADMIN</h2>
    <p style="color:#666">Connexion sécurisée Firebase</p>
    <input id="adminEmail" type="email" placeholder="Email" value="baracyriaque@gmail.com" style="width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;margin:10px 0;font-size:16px;box-sizing:border-box">
    <input id="adminPass" type="password" placeholder="Mot de passe Firebase" style="width:100%;padding:14px;border-radius:10px;border:1px solid #ddd;margin:10px 0;font-size:16px;box-sizing:border-box">
    <button id="loginBtn" style="width:100%;padding:14px;border:none;border-radius:10px;background:#ffcc00;font-weight:800;font-size:16px;cursor:pointer">SE CONNECTER</button>
    <p id="passError" style="color:#c62828;font-weight:800;display:none;margin-top:10px"></p>
    <p><a href="index.html" style="color:#1a73e8">← Back to Home</a></p>
  </div>
</div>
<!-- FIREBASE AUTH LOCK - END -->
<div class="box" id="adminContent" style="display:none">
<h1>🛠️ ISOMERO - Admin</h1>
<p style="text-align:center;color:#cbd5e1">Bujumbura • EAC • <a href="index.html" style="color:#ffcc00">Home</a> • <a href="manage-users.html" style="color:#ffcc00">Manage Users</a> • <a href="superleader.html" style="color:#ffcc00">Super Leader</a> • <a href="leader.html" style="color:#ffcc00">Leader</a> • <a href="teacher.html" style="color:#ffcc00">Teacher</a> • <a href="#" id="logoutLink" style="color:#ff6b6b">Logout</a></p>

<div class="stat">
  <div><b id="statKeys">-</b><span>Keys</span></div>
  <div><b id="statScores">-</b><span>Scores</span></div>
  <div><b id="statTests">-</b><span>Tests</span></div>
  <div><b id="statCerts">-</b><span>Certificates</span></div>
</div>

<div style="display:flex;gap:8px">
  <input id="searchInput" placeholder="🔍 Search by Name, Key, Course, School, Zone...">
  <button onclick="loadAll()" style="padding:12px 16px;background:#1e2540;color:white;border:none;border-radius:10px;font-weight:800;cursor:pointer">🔄</button>
</div>

<div class="tabs">
  <button id="tabKeys" class="active" onclick="showTab('keys')">🔑 Keys</button>
  <button id="tabScores" onclick="showTab('scores')">⭐ Scores</button>
  <button id="tabTests" onclick="showTab('tests')">📝 Tests</button>
  <button id="tabCerts" onclick="showTab('certs')">🎓 Certificates</button>
</div>

<div class="roleFilter" id="roleFilter" style="display:flex">
  <button id="rf-all" class="active" onclick="setRoleFilter('all')">Tous</button>
  <button id="rf-superadmin" onclick="setRoleFilter('superadmin')">👑 Super Admin</button>
  <button id="rf-admin" onclick="setRoleFilter('admin')">🛡️ Admin</button>
  <button id="rf-superleader" onclick="setRoleFilter('superleader')">👑 Super Leader</button>
  <button id="rf-leader" onclick="setRoleFilter('leader')">⭐ Leader</button>
  <button id="rf-teacher" onclick="setRoleFilter('teacher')">👨‍🏫 Teacher</button>
  <button id="rf-student" onclick="setRoleFilter('student')">🎓 Student</button>
</div>

<div id="list"><p style="text-align:center;color:#cbd5e1">⏳ Loading...</p></div>
</div>

<p style="text-align:center;font-size:12px;color:#cbd5e1;margin:20px 0 10px">© 2026 ISOMERO • EAC • Bujumbura • Made by Cyriaque Baranyizigiye</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk", authDomain: "isomero-f6887.firebaseapp.com", projectId: "isomero-f6887", storageBucket: "isomero-f6887.firebasestorage.app", messagingSenderId: "669743420568", appId: "1:669743420568:web:3b478914e4cd1525cd2ced", measurementId: "G-0QJZTRLQPG" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

const ALLOWED_EMAIL = 'baracyriaque@gmail.com';

// --- AUTH LOGIC ---
onAuthStateChanged(auth, (user)=>{
  if(user && user.email === ALLOWED_EMAIL){
    document.getElementById('adminLock').style.display='none';
    document.getElementById('adminContent').style.display='block';
    loadAll();
  } else {
    document.getElementById('adminLock').style.display='flex';
    document.getElementById('adminContent').style.display='none';
    if(user && user.email !== ALLOWED_EMAIL){ signOut(auth); }
  }
});
document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  const err = document.getElementById('passError');
  err.style.display='none';
  if(email !== ALLOWED_EMAIL){ err.textContent='❌ Email non autorisé'; err.style.display='block'; return; }
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ err.textContent='❌ '+e.message; err.style.display='block'; }
});
document.getElementById('adminPass').addEventListener('keypress',function(e){ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
document.getElementById('logoutLink').addEventListener('click', async (e)=>{ e.preventDefault(); await signOut(auth); });

let ALL = { keys:[], scores:[], tests:[], certs:[] };
let CURRENT = 'keys';
let ROLE_FILTER = 'all';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){
  if(!ts) return '-';
  try{ let d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }catch(e){ return '-'; }
}
function formatExp(v){
  if(!v) return '-';
  if(v==='Lifetime') return 'Lifetime';
  if(!isNaN(v) && String(v).length>=10){
    let d = new Date(Number(v));
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }
  return v;
}
function roleBadge(role){
  let r=(role||'student').toLowerCase();
  let map={superadmin:['👑 SUPER ADMIN','black'],admin:['🛡️ ADMIN','purple'],superleader:['👑 SUPER LEADER','pink'],leader:['⭐ LEADER','orange'],teacher:['👨‍🏫 TEACHER','blue'],student:['🎓 STUDENT','green']};
  let m=map[r]||['🎓 STUDENT','green'];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}
function filterList(arr, fields){
  let q = (document.getElementById('searchInput').value||'').toLowerCase().trim();
  let list = arr;
  if(ROLE_FILTER!=='all'){
    list = list.filter(x=> (x.role||'student').toLowerCase()===ROLE_FILTER);
  }
  if(!q) return list;
  return list.filter(x=> fields.some(f=> String(x[f]||'').toLowerCase().includes(q)));
}
function render(){
  let box = document.getElementById('list');
  let html = '';
  document.getElementById('roleFilter').style.display = CURRENT==='keys' ? 'flex' : 'none';
  if(CURRENT==='keys'){
    let list = filterList(ALL.keys, ['key','studentName','name','course','level','phone','school','zone','role']);
    if(!list.length) html = '<p style="text-align:center">No keys found for this role. Create in Manage Users.</p>';
    list.forEach(k=>{
      let expired = k.expiresAt && k.expiresAt!=='Lifetime' ? (new Date(Number(k.expiresAt)) < new Date()) : false;
      let name = esc(k.studentName||k.name||'-');
      html += `<div class="card"><b>🔑 ${esc(k.key||k.id)} - ${name}</b> ${roleBadge(k.role)} <span class="pill ${k.revoked?'red':expired?'red':'green'}">${k.revoked?'REVOKED':expired?'EXPIRED':'ACTIVE'}</span><p>Course: ${esc(k.course||'')} • Level: ${esc(k.level||'')} • Phone: ${esc(k.phone||'')} • Country: ${esc(k.country||'')}</p><p>🏫 School: <b>${esc(k.school||'ISOMERO')}</b> • 📍 Zone: <b>${esc(k.zone||'')}</b></p><p>Expires: ${formatExp(k.expiresAt||k.expiry)} • Used: ${k.used?'Yes ✅':'No'} • Created: ${fmtDate(k.createdAt)}</p><a href="https://wa.me/${String(k.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hello '+name+', your ISOMERO key: '+(k.key||''))}" target="_blank"><button style="padding:8px 12px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:800;cursor:pointer">💬 WhatsApp</button></a></div>`;
    });
  }
  if(CURRENT==='scores'){
    let list = filterList(ALL.scores, ['name','key','course','school','zone']);
    list.sort((a,b)=>(b.xp||0)-(a.xp||0));
    list.forEach((s,i)=>{
      let medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
      html += `<div class="card"><b>${medal} ${esc(s.name)} - ⭐ ${s.xp} XP</b> <span class="pill blue">🔥 ${s.streak||1} days</span><p>Course: ${esc(s.course)} • Key: ${esc(s.key)} • School: ${esc(s.school||'')} • Zone: ${esc(s.zone||'')} • Updated: ${fmtDate(s.updatedAt)}</p></div>`;
    });
    if(!list.length) html='<p style="text-align:center">No scores yet.</p>';
  }
  if(CURRENT==='tests'){
    let list = filterList(ALL.tests, ['studentName','name','key','course','level','school','zone']);
    list.forEach(t=>{
      html += `<div class="card"><b>${esc(t.studentName||t.name)} - ${esc(t.course)} ${esc(t.level)}</b> <span class="pill ${t.passed?'green':'red'}">${t.passed?'PASS ✅':'FAIL ❌'} ${t.percent}%</span><p>Score: ${t.score}/${t.total} = ${t.percent}% • Key: ${esc(t.key)} • School: ${esc(t.school||'')} • ${fmtDate(t.createdAt)}</p></div>`;
    });
    if(!list.length) html='<p style="text-align:center">No tests yet.</p>';
  }
  if(CURRENT==='certs'){
    let list = filterList(ALL.certs, ['studentName','name','key','course','level','verifyCode','school','zone']);
    list.forEach(c=>{
      html += `<div class="card"><b>🎓 ${esc(c.studentName||c.name)} - ${esc(c.course)} ${esc(c.level)}</b> <span class="pill green">${c.percent}% PASS</span><p>Code: <b style="font-family:monospace">${esc(c.verifyCode)}</b> • Key: ${esc(c.key)} • School: ${esc(c.school||'')} • ${fmtDate(c.createdAt)}</p><a href="https://wa.me/25762706404?text=${encodeURIComponent('Verify Certificate: '+c.verifyCode+' - '+(c.studentName||c.name))}"><button style="padding:8px 12px;background:#25D366;color:white;border:none;border-radius:8px;font-weight:800">✅ Verify</button></a></div>`;
    });
    if(!list.length) html='<p style="text-align:center">No certificates yet. Students need 80% on a Test.</p>';
  }
  box.innerHTML = html;
}
window.showTab = function(t){
  CURRENT=t;
  ['keys','scores','tests','certs'].forEach(x=> document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active', x===t));
  render();
};
window.setRoleFilter = function(r){
  ROLE_FILTER=r;
  ['all','superadmin','admin','superleader','leader','teacher','student'].forEach(x=>{
    let el=document.getElementById('rf-'+x);
    if(el) el.classList.toggle('active', x===r);
  });
  render();
};
document.getElementById('searchInput').addEventListener('input', render);
window.loadAll = async function(){
  document.getElementById('list').innerHTML = '<p style="text-align:center">⏳ Loading...</p>';
  try{
    let [kSnap, sSnap, tSnap, cSnap] = await Promise.all([
      getDocs(query(collection(db,'enrolmentKeys'), orderBy('createdAt','desc'), limit(200))),
      getDocs(query(collection(db,'scores'), orderBy('xp','desc'), limit(50))),
      getDocs(query(collection(db,'testScores'), orderBy('createdAt','desc'), limit(100))),
      getDocs(query(collection(db,'certificates'), orderBy('createdAt','desc'), limit(100)))
    ]);
    ALL.keys=[]; kSnap.forEach(d=>ALL.keys.push({id:d.id, ...d.data()}));
    ALL.scores=[]; sSnap.forEach(d=>ALL.scores.push(d.data()));
    ALL.tests=[]; tSnap.forEach(d=>ALL.tests.push(d.data()));
    ALL.certs=[]; cSnap.forEach(d=>ALL.certs.push(d.data()));
    document.getElementById('statKeys').innerText = ALL.keys.length;
    document.getElementById('statScores').innerText = ALL.scores.length;
    document.getElementById('statTests').innerText = ALL.tests.length;
    document.getElementById('statCerts').innerText = ALL.certs.length;
    render();
  }catch(e){
    document.getElementById('list').innerHTML = '<p style="text-align:center;color:#ffcc00">❌ Error: '+esc(e.message)+'<br>Check Firestore Rules.</p>';
  }
};
</script>
</body>
</html>
