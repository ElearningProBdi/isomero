<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISOMERO Admin</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;padding:20px;display:none}
.box{background:#fff;color:#000;padding:20px;border-radius:14px;max-width:600px;margin:auto}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:12px;background:#0d6efd;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-red{background:#dc2626}.btn-grey{background:#e2e8f0;color:#111}
.user{background:#f1f5f9;padding:10px;border-radius:10px;margin:8px 0}
</style>
</head>
<body>
<div class="box">
<h2>ISOMERO Admin</h2>
<p id="status">Checking...</p>
<div style="display:flex;gap:8px">
<button onclick="goHome()" class="btn-grey" style="flex:1">🏠 Home</button>
<button onclick="logoutAdmin()" class="btn-red" style="flex:1">🚪 Logout</button>
</div>
<div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, query, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk",
  authDomain: "isomero-f6887.firebaseapp.com",
  projectId: "isomero-f6887",
  storageBucket: "isomero-f6887.firebasestorage.app",
  messagingSenderId: "669743420568",
  appId: "1:669743420568:web:3b478914e4cd1525cd2ced",
  measurementId: "G-0QJZTRLQPG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let myRole = null;
let myEmail = "";
let myUid = "";

// ===== FIX 1: ANTI-XSS =====
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ===== FIX 2: QUI PEUT DONNER QUEL ROLE ? =====
// Super Admin: tout. Admin: SEULEMENT leader + teacher. Jamais admin, jamais super_admin.
function canAssignRole(targetRole){
  if(myRole==='super_admin') return ['student','teacher','leader','admin','super_admin'].includes(targetRole);
  if(myRole==='admin') return ['student','teacher','leader'].includes(targetRole);
  return false;
}
function allowedOptionsFor(currentRole){
  // Ce que MOI je peux voir dans le menu
  if(myRole==='super_admin') return ['student','teacher','leader','admin','super_admin'];
  if(myRole==='admin') return ['student','teacher','leader'];
  return [];
}

window.logoutAdmin = async function(){ await signOut(auth); window.location.href="login-firebase.html"; };
window.goHome = function(){ window.location.href="index.html"; };

onAuthStateChanged(auth, async (user) => {
  if(!user){ window.location.href = "login-firebase.html"; return; }
  // FIX: Compte désactivé ou email non vérifié = bloqué
  try{
    const snap = await getDoc(doc(db, "users", user.uid));
    if(!snap.exists()){ alert("⚠️ No role - Ask Super Admin"); window.location.href = "index.html"; return; }
    const data = snap.data();
    if(data.active === false){ alert("🚫 Account disabled. Contact Super Admin."); await signOut(auth); return; }
    myRole = data.role;
    myEmail = user.email;
    myUid = user.uid;
    if(myRole !== "admin" && myRole !== "super_admin"){ window.location.href = "index.html"; return; }
    document.body.style.display = "block";
    document.getElementById('status').textContent = '✅ Welcome ' + myRole + ': ' + user.email;
    await loadUsersList();
  }catch(e){ document.getElementById('status').textContent='❌ '+e.message; }
});

async function loadUsersList(){
  const users = await getDocs(query(collection(db, "users"), limit(200)));
  const listEl = document.getElementById('list');
  listEl.innerHTML = "";
  users.forEach(u => {
    const d = u.data();
    // Admin ne voit pas Super Admin
    if(d.role === "super_admin" && myRole !== "super_admin") return;
    const div = document.createElement('div');
    div.className='user';
    const b = document.createElement('b'); b.textContent = d.email || d.name || u.id;
    const br = document.createElement('br');
    const span = document.createElement('span'); span.textContent = 'Role: '+(d.role||'student') + (d.active===false?' • 🚫 DISABLED':'');
    const sel = document.createElement('select');
    // FIX: On ne met que les roles que JE peux donner
    allowedOptionsFor().forEach(r=>{
      const o=document.createElement('option'); o.value=r; o.textContent=r; if(d.role===r) o.selected=true; sel.appendChild(o);
    });
    // Si le role actuel n'est pas dans mes options (ex: admin), on l'affiche mais désactivé
    if(!allowedOptionsFor().includes(d.role)){
      const o=document.createElement('option'); o.value=d.role; o.textContent=d.role+' (protected)'; o.selected=true; o.disabled=true; sel.appendChild(o);
      sel.disabled=true;
    }
    // FIX: Pas de onchange en string, on utilise un listener + data
    sel.addEventListener('change', ()=> changeRole(u.id, sel.value));
    div.append(b, br, span, sel);
    listEl.appendChild(div);
  });
}

window.changeRole = async (uid, newRole) => {
  // ===== FIX 3: NE JAMAIS FAIRE CONFIANCE AU NAVIGATEUR =====
  // On re-lit le VRAI role de la cible dans Firebase, pas le oldRole envoyé
  if(!canAssignRole(newRole)){ alert("❌ Your role cannot assign "+newRole); location.reload(); return; }
  // FIX 4: INTERDIT DE TOUCHER SON PROPRE COMPTE
  if(uid === myUid){ alert("❌ You cannot change your own role. Ask another Super Admin."); location.reload(); return; }
  try{
    const targetSnap = await getDoc(doc(db, "users", uid));
    if(!targetSnap.exists()){ alert("❌ User not found"); return; }
    const realOldRole = targetSnap.data().role;
    // FIX 5: SEUL SUPER ADMIN TOUCHE UN SUPER ADMIN - vérifié côté serveur (re-lecture)
    if(realOldRole === "super_admin" && myRole !== "super_admin"){
      alert("❌ Only Super Admin can touch a Super Admin"); location.reload(); return;
    }
    if(newRole === "super_admin" && myRole !== "super_admin"){
      alert("❌ Only Super Admin can promote to Super Admin"); location.reload(); return;
    }
    // FIX 6: SEUL SUPER ADMIN PEUT DONNER ADMIN
    if(newRole === "admin" && myRole !== "super_admin"){
      alert("❌ Only Super Admin can promote to Admin. You can only create Leader / Teacher."); location.reload(); return;
    }
    if(!confirm("Change role of "+esc(targetSnap.data().email||uid)+" from "+realOldRole+" to "+newRole+" ?")){ location.reload(); return; }
    await updateDoc(doc(db, "users", uid), { role: newRole, roleChangedBy: myEmail, roleChangedAt: Date.now() });
    alert("✅ Changed to " + newRole);
    await loadUsersList();
  }catch(e){ alert("❌ "+e.message); location.reload(); }
};
</script>
</body>
</html>
