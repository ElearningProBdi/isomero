<!DOCTYPE html>
<html>
<head>
<title>ISOMERO - Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;background:#F5F5F5;margin:0;padding:15px}
.top{background:white;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
