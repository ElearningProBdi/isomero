<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ISOMERO STABLE V1.1</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 min-h-screen">
<div class="bg-black text-white p-3 flex gap-2 text-sm"><select id="role" class="text-black rounded px-2 py-1"><option value="teacher">Teacher</option><option value="leader">Leader</option><option value="student">Student</option><option value="admin">Admin</option></select><input id="lic" type="number" value="12" class="w-20 text-black rounded px-2"><span id="badge" class="ml-auto bg-white text-black px-3 py-1 rounded-full text-xs font-bold"></span></div>
<header class="bg-white p-4 flex justify-between"><h1 class="font-bold">ISOMERO V1.1 - NO DEBT</h1><button id="createBtn" onclick="createCourse()" class="bg-black text-white px-5 py-2 rounded-xl text-sm">+ Create</button></header>
<main class="p-6 max-w-6xl mx-auto"><div id="grid" class="grid md:grid-cols-3 gap-5"></div></main>
<script>
const MY_ID = "user_123";
const PERMISSIONS = { student:{canCreate:false,canEdit:false,canDelete:false}, teacher:{canCreate:true,canEdit:true,canDelete:false}, leader:{canCreate:true,canEdit:true,canDelete:false}, admin:{canCreate:true,canEdit:true,canDelete:true} };
const RULES = { MIN_LICENCES:10, hasLicences:(role,n)=>(role==='teacher'||role==='leader')?n>=10:true, isOwner:(role,ownerId)=>(role==='teacher'||role==='leader')?ownerId===MY_ID:true };
function can(action, course=null){ const role=document.getElementById('role').value; const licences=parseInt(document.getElementById('lic').value)||0; if(!PERMISSIONS[role][action]) return false; if(!RULES.hasLicences(role,licences)) return false; if(course && action==='canEdit' && !RULES.isOwner(role,course.ownerId)) return false; return true; }
let COURSES = [{id:'1',title:'Français A1',price:20000,ownerId:'user_123'},{id:'2',title:'English Business',price:25000,ownerId:'other_999'}];
function render(){ const role=document.getElementById('role').value; const licences=parseInt(document.getElementById('lic').value)||0; document.getElementById('badge').textContent=role.toUpperCase()+" - "+licences+" lic"; document.getElementById('createBtn').style.display=can('canCreate')?"block":"none"; const grid=document.getElementById('grid'); grid.innerHTML=''; COURSES.forEach(c=>{ const canEdit=can('canEdit',c); const canDelete=can('canDelete',c); const div=document.createElement('div'); div.className='bg-white rounded-2xl p-5 border'; const editBtn = canEdit ? `<button onclick="editCourse('${c.id}')" class="bg-black text-white px-4 py-2 rounded-xl text-sm">Edit</button>` : ''; const delBtn = canDelete ? `<button onclick="deleteCourse('${c.id}')" class="text-red-500 text-sm px-2">Delete</button>` : ''; const lock = !canEdit && !canDelete ? `<span class="text-xs text-gray-400">🔒 View only - not your course</span>` : ''; div.innerHTML=`<h3 class="font-bold">${c.title} ${c.ownerId===MY_ID?'(MINE)':'(OTHER)'}</h3><p class="text-xs text-gray-500 mt-1">${c.price} RWF</p><div class="mt-3 flex gap-2">${editBtn}${delBtn}${lock}</div>`; grid.appendChild(div); }); }
function createCourse(){ if(!can('canCreate')){alert('Need 10 licences/year');return} const t=prompt('Title?'); if(t){COURSES.push({id:Date.now().toString(),title:t,price:15000,ownerId:MY_ID}); render();} }
function editCourse(id){ const c=COURSES.find(x=>x.id===id); if(!c || !can('canEdit',c)){alert('Not allowed - not your course or need 10 licences');return} const newTitle=prompt('New title?',c.title); if(newTitle){c.title=newTitle; render();} }
function deleteCourse(id){ if(!can('canDelete')){alert('Admin only');return} if(confirm('Delete course?')){COURSES=COURSES.filter(x=>x.id!==id); render();} }
document.getElementById('role').onchange=render; document.getElementById('lic').oninput=render; render();
</script>
</body>
</html>
