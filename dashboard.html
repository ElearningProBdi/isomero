<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISOMERO - Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box} body{font-family:'Segoe UI',sans-serif;background:#FFF7F0;margin:0;color:#222}
header{background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.logo{font-weight:900;font-size:22px;letter-spacing:3px}.logo span{color:#FF6B00}
.badge{background:#FF6B00;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.container{max-width:1000px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:16px;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:#888}
.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h3{margin:0 0 12px} input,select,textarea{width:100%;padding:12px;border:1px solid #eee;border-radius:10px;margin:6px 0;font-size:14px;background:#FAFAFA}
textarea{min-height:70px}
button{padding:12px 16px;border:none;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px}
.btn-orange{background:#FF6B00;color:#fff}.btn-gray{background:#eee}.btn-green{background:#25D366;color:#fff}.btn-red{background:#FF3B30;color:#fff}.btn-blue{background:#007BFF;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{background:#FFF1E6;border:1px solid #FFB37A;padding:12px;border-radius:12px;font-size:13px}
.courses{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:650px){.courses,.row,.stats{grid-template-columns:1fr}}
.course{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.course img{width:100%;height:160px;object-fit:cover}
.course-body{padding:14px}.course-body h4{margin:0 0 6px;font-size:16px}.course-body p{font-size:13px;color:#666;margin:0 0 8px;line-height:1.4}
.tag{display:inline-block;background:#FFF0E6;color:#FF6B00;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;margin-right:4px}
.owner{font-size:11px;color:#999;margin:6px 0}
.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{padding:9px 11px;font-size:12px}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}
.modal-box{background:#fff;width:100%;max-width:520px;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.modal-box img{width:100%;border-radius:12px}
</style>
</head>
<body>

<header>
  <div class="logo">ISO<span>MERO</span><div style="font-size:10px;letter-spacing:2px;color:#999;font-weight:400">E-LEARNING PLATFORM</div></div>
  <div style="text-align:right">
    <span class="badge" id="roleBadge">...</span><br>
    <span id="userEmail" style="font-size:11px"></span><br>
    <span id="licenceInfo" style="font-size:11px;color:#FF6B00;font-weight:800"></span>
  </div>
</header>

<div class="container">

<div class="stats">
  <div class="stat"><b id="statTotal">0</b><span>Total Courses</span></div>
  <div class="stat"><b id="statMine">0</b><span>My Courses</span></div>
  <div class="stat"><b id="statLic" style="color:#FF6B00">0</b><span>My Licences</span></div>
</div>

<div id="licenceWarn" class="card warn hidden"></div>

<!-- CREATE -->
<div class="card" id="createCard">
  <h3>➕ Create New Course</h3>
  <input id="cTitle" placeholder="✏️ Course Title * e.g. Learn English Fast">
  <textarea id="cDesc" placeholder="📝 Course Description - What will students learn?"></textarea>
  <div class="row">
    <select id="cCat"><option value="">📂 Category</option><option>English</option><option>Math</option><option>Business</option><option>IT & Computer</option><option>Science</option><option>Music</option><option>Other</option></select>
    <select id="cLevel"><option value="">📊 Level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>All Levels</option></select>
  </div>
  <div class="row">
    <input id="cDuration" placeholder="⏱️ Duration e.g. 5 Hours, 12 Lessons">
    <input id="cLessons" placeholder="📚 Lessons e.g. 12">
  </div>
  <input id="cImage" placeholder="🖼️ Image URL (paste link)">
  <input id="cVideo" placeholder="🎥 Video URL - YouTube / Vimeo link">
  <textarea id="cLessonContent" placeholder="📖 Lesson 1 Content / What is inside?"></textarea>
  <button class="btn-orange" style="width:100%" onclick="createCourse()">+ CREATE COURSE</button>
  <p id="createMsg" style="font-size:13px;color:red"></p>
  <p style="font-size:11px;color:#999;text-align:center">No price on dashboard - Price is managed by Admin only</p>
</div>

<!-- SELL -->
<div class="card hidden" id="sellCard" style="border:2px solid #25D366">
  <h3>💰 Sell Courses - Leader</h3>
  <p style="font-size:13px;color:#666">Share your link, earn from your sales. Price is hidden on dashboard.</p>
  <button class="btn-green" onclick="copySellLink()">🔗 Copy My Sell Link</button>
  <span id="sellMsg" style="font-size:13px;margin-left:8px"></span>
</div>

<!-- SEARCH -->
<div class="card">
  <h3>📚 All Courses <span style="font-size:12px;color:#999;font-weight:400">- No Price Shown</span></h3>
  <div class="row">
    <input id="searchInput" placeholder="🔍 Search course..." oninput="loadCourses()">
    <select id="filterCat" onchange="loadCourses()"><option value="">All Categories</option><option>English</option><option>Math</option><option>Business</option><option>IT & Computer</option><option>Science</option><option>Music</option><option>Other</option></select>
  </div>
  <div id="coursesList" style="margin-top:14px">Loading...</div>
</div>

<div style="display:flex;gap:8px">
  <button class="btn-gray" onclick="logout()">Logout</button>
  <button class="btn-gray" onclick="location.reload()">↻ Refresh</button>
</div>
</div>

<!-- VIEW MODAL -->
<div id="viewModal" class="modal hidden" onclick="if(event.target===this) closeModal()">
  <div class="modal-box">
    <img id="mImg">
    <h2 id="mTitle"></h2>
    <div id="mTags"></div>
    <p id="mDesc" style="color:#555;line-height:1.5"></p>
    <p id="mMeta" style="font-size:12px;color:#999"></p>
    <div id="mVideoWrap"></div>
    <button class="btn-orange" style="width:100%" onclick="closeModal()">Close</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk",authDomain:"isomero-f6887.firebaseapp.com",projectId:"isomero-f6887",storageBucket:"isomero-f6887.firebasestorage.app",messagingSenderId:"669743420568",appId:"1:669743420568:web:3b478914e4cd1525cd2ced",measurementId:"G-0QJZTRLQPG"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(); const auth=firebase.auth();
const SUPER_EMAIL="baracyque@gmail.com";
const ADMIN_EMAILS=["baracyque@gmail.com"]; // <-- ADD YOUR ADMIN EMAILS HERE

let currentUser=JSON.parse(localStorage.getItem("isomero_current")||"null");
if(!currentUser) window.location.href="login-firebase.html";
// FORCE ADMIN / SUPER ADMIN - FIX FOR MISSING BUTTON
if(currentUser.email===SUPER_EMAIL){currentUser.role="super_admin";currentUser.licences=999;}
else if(ADMIN_EMAILS.includes(currentUser.email)){currentUser.role="admin";currentUser.licences=999;}

function canCreateEdit(u){if(u.role==="admin"||u.role==="super_admin")return true; if(u.role==="teacher"||u.role==="leader") return (u.licences||0)>=10; return false;}
function canSell(u){return ["leader","admin","super_admin"].includes(u.role);}
function canDelete(u){return u.role==="admin"||u.role==="super_admin";}
function canEditThis(u,c){if(u.role==="admin"||u.role==="super_admin")return true; if((u.role==="teacher"||u.role==="leader")&&(u.licences||0)>=10){return c.ownerUid===u.uid||c.ownerEmail===u.email;} return false;}

document.getElementById("roleBadge").innerText=currentUser.role.toUpperCase();
document.getElementById("userEmail").innerText=currentUser.email;
document.getElementById("licenceInfo").innerText="Licences: "+(currentUser.licences||0);
document.getElementById("statLic").innerText=currentUser.licences||0;

if(!canCreateEdit(currentUser)){
  document.getElementById("createCard").classList.add("hidden");
  if(currentUser.role==="teacher"||currentUser.role==="leader"){
    let w=document.getElementById("licenceWarn"); w.classList.remove("hidden");
    w.innerHTML="⚠️ You have <b>"+(currentUser.licences||0)+" licences</b>. Buy at least <b>10 licences</b> to Create/Edit your own courses. Contact Admin to buy licences.";
  }
  if(currentUser.role==="student"){
    let w=document.getElementById("licenceWarn"); w.classList.remove("hidden");
    w.innerHTML="👋 Welcome Student! You can <b>View</b> all courses. To Create courses, become Teacher/Leader and buy 10 licences.";
  }
}
if(canSell(currentUser)) document.getElementById("sellCard").classList.remove("hidden");

let allCourses=[];
async function createCourse(){
  if(!canCreateEdit(currentUser)) return document.getElementById("createMsg").innerText="You need at least 10 licences to create.";
  const title=document.getElementById("cTitle").value.trim();
  if(!title) return document.getElementById("createMsg").innerText="Enter Title";
  try{
    await db.collection("courses").add({
      title:title,
      description:document.getElementById("cDesc").value.trim(),
      category:document.getElementById("cCat").value,
      level:document.getElementById("cLevel").value,
      duration:document.getElementById("cDuration").value.trim(),
      lessonsCount:document.getElementById("cLessons").value.trim(),
      image:document.getElementById("cImage").value.trim()||"https://via.placeholder.com/600x300?text=ISOMERO",
      video:document.getElementById("cVideo").value.trim(),
      lessonContent:document.getElementById("cLessonContent").value.trim(),
      ownerUid:currentUser.uid, ownerEmail:currentUser.email, ownerRole:currentUser.role,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById("createMsg").style.color="green"; document.getElementById("createMsg").innerText="✅ Course Created Successfully!";
    ["cTitle","cDesc","cDuration","cLessons","cImage","cVideo","cLessonContent"].forEach(id=>document.getElementById(id).value="");
    loadCourses();
  }catch(e){document.getElementById("createMsg").innerText=e.message;}
}
async function loadCourses(){
  const list=document.getElementById("coursesList");
  try{
    const snap=await db.collection("courses").orderBy("createdAt","desc").get();
    allCourses=[]; snap.forEach(d=>allCourses.push({id:d.id,...d.data()}));
    let q=(document.getElementById("searchInput").value||"").toLowerCase();
    let fc=document.getElementById("filterCat").value;
    let filtered=allCourses.filter(c=>(!q||(c.title||"").toLowerCase().includes(q))&&(!fc||c.category===fc));
    document.getElementById("statTotal").innerText=allCourses.length;
    document.getElementById("statMine").innerText=allCourses.filter(c=>c.ownerEmail===currentUser.email).length;
    if(!filtered.length){list.innerHTML="<p>No courses found.</p>";return;}
    list.innerHTML=`<div class="courses">${filtered.map(c=>{
      let canEdit=canEditThis(currentUser,c); let canDel=canDelete(currentUser);
      return `<div class="course"><img src="${c.image}"><div class="course-body">
      <h4>${c.title||"Untitled"}</h4>
      <div><span class="tag">${c.category||"General"}</span><span class="tag">${c.level||"All Levels"}</span></div>
      <p>${(c.description||"").slice(0,90)}...</p>
      <div class="owner">👤 ${c.ownerEmail||""} • ⏱️ ${c.duration||""} • 📚 ${c.lessonsCount||""} lessons</div>
      <div class="actions">
      <button class="btn-blue" onclick="viewCourse('${c.id}')">👁️ View</button>
      ${canEdit?`<button class="btn-orange" onclick="editCourse('${c.id}')">✏️ Edit</button>`:""}
      ${canDel?`<button class="btn-red" onclick="deleteCourse('${c.id}')">🗑️ Delete</button>`:""}
      ${canSell(currentUser)?`<button class="btn-green" onclick="sellThis('${c.id}')">💰 Sell</button>`:""}
      </div></div></div>`}).join("")}</div>`;
  }catch(e){list.innerHTML="Error: "+e.message;}
}
function viewCourse(id){let c=allCourses.find(x=>x.id===id); if(!c) return; document.getElementById("mImg").src=c.image; document.getElementById("mTitle").innerText=c.title; document.getElementById("mTags").innerHTML=`<span class="tag">${c.category||""}</span><span class="tag">${c.level||""}</span>`; document.getElementById("mDesc").innerText=c.description||""; document.getElementById("mMeta").innerText=`By ${c.ownerEmail} • ${c.duration||""} • ${c.lessonsCount||""} lessons • ${c.lessonContent||""}`; document.getElementById("mVideoWrap").innerHTML=c.video?`<p><a href="${c.video}" target="_blank">🎥 Watch Video</a></p>`:""; document.getElementById("viewModal").classList.remove("hidden");}
function closeModal(){document.getElementById("viewModal").classList.add("hidden");}
function editCourse(id){let c=allCourses.find(x=>x.id===id); let nt=prompt("Edit Title:",c.title); if(!nt) return; let nd=prompt("Edit Description:",c.description||""); db.collection("courses").doc(id).update({title:nt,description:nd}).then(()=>loadCourses());}
async function deleteCourse(id){if(!confirm("Delete this course?"))return; await db.collection("courses").doc(id).delete(); loadCourses();}
function sellThis(id){let link=window.location.origin+"/login-firebase.html?ref="+currentUser.uid+"&course="+id; prompt("Copy your sell link:",link);}
function copySellLink(){let link=window.location.origin+"/login-firebase.html?ref="+currentUser.uid; navigator.clipboard.writeText(link).then(()=>document.getElementById("sellMsg").innerText="✅ Link copied!");}
function logout(){localStorage.removeItem("isomero_current"); auth.signOut().then(()=>window.location.href="login-firebase.html");}
loadCourses();
</script>
</body>
</html>
