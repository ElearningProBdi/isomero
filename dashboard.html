<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOMERO - Dashboard Systématique</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="bg-yellow-100 border-b border-yellow-300 p-3 flex items-center gap-3">
  <span class="text-xs font-bold text-yellow-800">DEV MODE - Tester rôle:</span>
  <select id="roleSwitcher" onchange="switchRole(this.value)" class="text-sm border rounded px-2 py-1">
    <option value="student">Student</option>
    <option value="teacher">Teacher</option>
    <option value="leader">Leader</option>
    <option value="admin">Admin</option>
  </select>
  <span id="currentUserDisplay" class="text-xs ml-4"></span>
</div>

<header class="bg-white shadow-sm p-4 flex justify-between items-center">
  <h1 class="text-xl font-bold">ISOMERO <span id="roleBadge" class="text-xs bg-gray-100 px-2 py-1 rounded ml-2"></span></h1>
  <div class="flex gap-2">
    <button id="createCourseBtn" onclick="openCreateModal()" class="hidden bg-black text-white px-4 py-2 rounded-lg text-sm hover:bg-gray-800">+ Créer Cours</button>
  </div>
</header>

<main class="p-6 max-w-6xl mx-auto">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <p class="text-xs text-gray-500 uppercase">Mes Cours</p>
      <p id="statCourses" class="text-2xl font-bold">0</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <p class="text-xs text-gray-500 uppercase">Étudiants</p>
      <p id="statStudents" class="text-2xl font-bold">0</p>
    </div>
    <div id="salesCard" class="hidden bg-white p-4 rounded-xl shadow-sm border-2 border-green-100">
      <p class="text-xs text-green-600 uppercase">💰 Ventes</p>
      <p class="text-2xl font-bold text-green-600">0 RWF</p>
    </div>
  </div>

  <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  <div id="usersSection" class="hidden mt-10 bg-white rounded-xl shadow-sm p-6">
    <h2 class="font-bold mb-4">👥 Gestion Utilisateurs</h2>
    <div id="usersList"></div>
  </div>
</main>

<div id="createModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl p-6 w-full max-w-md">
    <h3 class="font-bold text-lg mb-4">Nouveau Cours</h3>
    <input id="newTitle" placeholder="Titre (ex: Kinyarwanda A1)" class="w-full border rounded-lg p-3 mb-3">
    <input id="newPrice" type="number" placeholder="Prix RWF (ex: 15000)" class="w-full border rounded-lg p-3 mb-4">
    <div class="flex gap-2 justify-end">
      <button onclick="closeCreateModal()" class="px-4 py-2 text-sm">Annuler</button>
      <button onclick="confirmCreateCourse()" class="bg-black text-white px-6 py-2 rounded-lg text-sm">Créer</button>
    </div>
  </div>
</div>

<script>
let COURSES = [
  { id: 'c1', title: 'Français A1', owner: 'u_teacher_1', price: 20000, students: 12 },
  { id: 'c2', title: 'Anglais Business', owner: 'u_teacher_2', price: 25000, students: 8 },
  { id: 'c3', title: 'Kinyarwanda Débutant', owner: 'u_teacher_1', price: 15000, students: 45 },
];
let USERS = [
  { id: 'u_student_1', name: 'Alice', role: 'student', myCourses: ['c1'] },
  { id: 'u_teacher_1', name: 'Prof. Jean', role: 'teacher', myCourses: ['c1', 'c3'] },
  { id: 'u_admin_1', name: 'Admin Cyriaque', role: 'admin', myCourses: [] },
];
let CURRENT_USER = USERS[0];

const PERMISSIONS = {
  student: { canCreate: false, canEditOwn: false, canEditAll: false, canSell: false, canManageUsers: false },
  teacher: { canCreate: true, canEditOwn: true, canEditAll: false, canSell: false, canManageUsers: false },
  leader:  { canCreate: false, canEditOwn: false, canEditAll: false, canSell: true, canManageUsers: false },
  admin:   { canCreate: true, canEditOwn: true, canEditAll: true, canSell: true, canManageUsers: true },
};

function getPerm() { return PERMISSIONS[CURRENT_USER.role]; }
function canEditCourse(course) {
  const p = getPerm();
  if (p.canEditAll) return true;
  if (p.canEditOwn && course.owner === CURRENT_USER.id) return true;
  return false;
}
function switchRole(role) {
  const found = USERS.find(u => u.role === role);
  CURRENT_USER = found ? found : { id: 'temp_'+role, name: role, role: role, myCourses: [] };
  render();
}
function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); document.getElementById('newTitle').value=''; document.getElementById('newPrice').value=''; }
function confirmCreateCourse() {
  const title = document.getElementById('newTitle').value.trim();
  const price = parseInt(document.getElementById('newPrice').value) || 0;
  if (!title) { alert('Titre requis'); return; }
  const newCourse = { id: 'c_'+Date.now(), title, owner: CURRENT_USER.id, price, students: 0 };
  COURSES.push(newCourse);
  if (!CURRENT_USER.myCourses) CURRENT_USER.myCourses = [];
  CURRENT_USER.myCourses.push(newCourse.id);
  closeCreateModal(); render();
}
function deleteCourse(id) {
  if (!confirm('Supprimer ce cours ?')) return;
  COURSES = COURSES.filter(c => c.id !== id);
  render();
}
function render() {
  const perm = getPerm();
  document.getElementById('roleBadge').textContent = CURRENT_USER.role.toUpperCase();
  document.getElementById('currentUserDisplay').textContent = CURRENT_USER.name + ' (' + CURRENT_USER.id + ')';
  document.getElementById('roleSwitcher').value = CURRENT_USER.role;
  document.getElementById('createCourseBtn').classList.toggle('hidden', !perm.canCreate);
  document.getElementById('salesCard').classList.toggle('hidden', !perm.canSell);
  document.getElementById('usersSection').classList.toggle('hidden', !perm.canManageUsers);
  document.getElementById('statCourses').textContent = perm.canEditAll ? COURSES.length : (CURRENT_USER.myCourses ? CURRENT_USER.myCourses.length : 0);
  document.getElementById('statStudents').textContent = COURSES.reduce((a,c) => perm.canEditAll || CURRENT_USER.myCourses?.includes(c.id) ? a+c.students : a, 0);
  const grid = document.getElementById('coursesGrid'); grid.innerHTML = '';
  COURSES.forEach(course => {
    const canEdit = canEditCourse(course);
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl shadow-sm p-5 border ' + (canEdit ? 'border-black' : 'border-gray-100');
    card.innerHTML = `
      <div class="flex justify-between items-start mb-3">
        <h3 class="font-bold">${course.title}</h3>
        ${canEdit ? '<span class="text-[10px] bg-black text-white px-2 py-1 rounded">OWN</span>' : ''}
      </div>
      <p class="text-xs text-gray-500 mb-4">${course.students} étudiants • ${course.price} RWF</p>
      <div class="flex gap-2">
        <button class="flex-1 bg-gray-100 py-2 rounded-lg text-sm">VIEW</button>
        ${canEdit ? `<button onclick="alert('Edit: ${course.title}')" class="flex-1 bg-black text-white py-2 rounded-lg text-sm">EDIT</button>` : ''}
        ${perm.canSell ? `<button class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm">SELL</button>` : ''}
        ${canEdit ? `<button onclick="deleteCourse('${course.id}')" class="px-3 py-2 text-red-500 text-sm">✕</button>` : ''}
      </div>`;
    grid.appendChild(card);
  });
  if (perm.canManageUsers) {
    document.getElementById('usersList').innerHTML = USERS.map(u => `<div class="flex justify-between py-2 border-b text-sm"><span>${u.name}</span><span class="text-xs bg-gray-100 px-2 py-1 rounded">${u.role}</span></div>`).join('');
  }
}
render();
</script>
</body>
</html>
