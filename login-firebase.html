<!DOCTYPE html>
<html>
<head><title>ISOMERO - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:sans-serif;background:#F5F5F5;margin:0;padding:15px}.card{background:white;padding:25px;border-radius:12px;max-width:400px;margin:30px auto;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;box-sizing:border-box;margin:6px 0}button{width:100%;padding:12px;background:#FF6B00;color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:10px;font-weight:bold}</style>
</head>
<body>
<div class="card">

<!-- LOGO ISOMERO START -->
<div style="text-align:center;margin-bottom:15px">
  <div style="font-size:60px;line-height:1">🎓</div>
  <h1 style="margin:5px 0 0 0;font-size:36px;letter-spacing:3px;color:#111">ISOMERO</h1>
  <p style="margin:0;font-size:11px;letter-spacing:4px;color:#FF6B00;font-weight:bold">E-LEARNING PLATFORM</p>
  <div style="width:60px;height:4px;background:#FF6B00;margin:12px auto;border-radius:2px"></div>
  <p style="color:#666;font-size:14px">Apprends. Enseigne. Vends.</p>
</div>
<!-- LOGO ISOMERO END -->

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login →</button>
<p id="msg" style="font-size:13px;color:red"></p>
<p style="font-size:12px;color:#888">Demo: super_admin = baracyriaque@gmail.com</p>
</div>
<script>
const SUPER_EMAIL = "baracyriaque@gmail.com";
function login(){
  const email = document.getElementById("email").value.trim().toLowerCase();
  const pass = document.getElementById("password").value;
  if(!email || !pass) return document.getElementById("msg").innerText = "Enter email + password";
  let users = JSON.parse(localStorage.getItem("isomero_users") || "[]");
  let u = users.find(x=>x.email.toLowerCase()===email);
  let role = "student", licences = 0;
  if(email === SUPER_EMAIL){ role = "super_admin"; licences = 999; }
  else if(u){ role = u.role; licences = u.licences||0; }
  else { users.push({email:email, role:"student", licences:0}); localStorage.setItem("isomero_users", JSON.stringify(users)); }
  localStorage.setItem("isomero_current", JSON.stringify({email:email, role:role, licences:licences, uid:email}));
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
