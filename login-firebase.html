<!DOCTYPE html>
<html>
<head><title>ISOMERO Firebase Login</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f5f5f5;margin:0}.card{background:white;padding:30px;border-radius:12px;width:320px;box-shadow:0 4px 20px rgba(0,0,0,.1)}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:8px;margin-top:10px;cursor:pointer}</style>
</head>
<body>
<div class="card"><h2>ISOMERO Login - Firebase</h2>
<input id="email" type="email" placeholder="Email" value="baracyriaque@gmail.com">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()" style="background:#FF6B00">Sign Up</button>
<p id="msg"></p></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCAGm3aAIm1FvUAKjjy5DWBc3tEX6Bja",
  authDomain: "isomero-6b87.firebaseapp.com",
  projectId: "isomero-6b87",
  storageBucket: "isomero-6b87.firebasestorage.app",
  messagingSenderId: "669743428680",
  appId: "1:669743428680:web:53ac8d56c9e2b7cd2ced",
  measurementId: "G-VQW76ANC88"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const SUPER_EMAIL = "baracyriaque@gmail.com";
async function login(){
  const e=document.getElementById("email").value.trim();
  const p=document.getElementById("password").value;
  try{
    const res = await auth.signInWithEmailAndPassword(e,p);
    const role = (e.toLowerCase()===SUPER_EMAIL) ? "super_admin" : "student";
    localStorage.setItem("isomero_current", JSON.stringify({email:res.user.email, role:role, uid:res.user.uid}));
    document.getElementById("msg").innerText="Success! Welcome "+res.user.email+" - "+role;
    setTimeout(()=>{ window.location.href="dashboard.html"; },800);
  }catch(err){ document.getElementById("msg").innerText=err.message; }
}
async function signup(){
  const e=document.getElementById("email").value.trim();
  const p=document.getElementById("password").value;
  try{
    const res = await auth.createUserWithEmailAndPassword(e,p);
    document.getElementById("msg").innerText="Account created! Now click Login";
  }catch(err){ document.getElementById("msg").innerText=err.message; }
}
</script>
</body>
</html>
