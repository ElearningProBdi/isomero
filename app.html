<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISOMERO - English Courses</title><style>
body{margin:0;background:#0a0e1f;color:#eef;font-family:system-ui;padding:8px}
.card{background:#131a36;border:1px solid #1e2540;border-radius:14px;padding:12px;margin:10px 0;position:relative;overflow:hidden}
button{border:none;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;margin:4px 0;width:100%}.btn-gold{background:#ffcc00;color:#000}.btn-dark{background:#fff;color:#000}.btn-green{background:#00ff88;color:#000}
select,input,textarea{background:#0f1326;color:#fff;border:1px solid #1e2540;padding:10px;border-radius:10px;width:100%;margin:4px 0}
.badge{font-size:11px;padding:4px 8px;border-radius:99px}.ok{background:#00ff88;color:#000;font-weight:800}.lock{background:#ff2a5a;color:#fff;font-weight:800}.warn{background:#ffcc00;color:#000;font-weight:800}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #1e2540;position:sticky;top:0;background:#0a0e1f;z-index:10}
.player{position:fixed;inset:0;background:rgba(0,0,0,.93);padding:10px;display:none;z-index:99;overflow:auto}.player.open{display:block}.sheet{max-width:820px;margin:auto;background:#0f1326;border-radius:14px;padding:12px;border:1px solid #1e2540}
.q{margin:10px 0;padding:12px;border-radius:12px;background:#11162e;border:1px solid #1e2540}
.keybox{background:#1a1600;border:1px dashed #ffcc00;border-radius:10px;padding:10px;margin-top:8px}
</style></head><body>
<div class="header"><b>ISOMERO - ENGLISH ✅ FIREBASE</b><span id="fbStatus" style="font-size:11px;color:#ffcc00">⏳ Connecting Firebase...</span></div>
<div id="list"></div><div class="player" id="playerBox"><div class="sheet" id="player"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== ✅ FIREBASE CONFIG - IS HERE - DO NOT DELETE =====
const firebaseConfig = {
  apiKey: "AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk",
  authDomain: "isomero-f6887.firebaseapp.com",
  projectId: "isomero-f6887",
  storageBucket: "isomero-f6887.appspot.com",
  messagingSenderId: "109876543210",
  appId: "1:109876543210:web:isomero123456"
};
// ================================================
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById('fbStatus').innerText = "✅ Firebase Connected: " + firebaseConfig.projectId;
document.getElementById('fbStatus').style.color = "#00ff88";

function getDeviceId(){
  let s=navigator.userAgent+screen.width+screen.height+navigator.language+(navigator.hardwareConcurrency||4)+Intl.DateTimeFormat().resolvedOptions().timeZone;
  let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return 'D'+Math.abs(h).toString().slice(0,6);
}
const myDeviceId = getDeviceId();
function youtubeEmbedder(url){
 if(!url) return ''; url=url.trim(); let id='';
 if(url.includes('youtu.be/')) id=url.split('youtu.be/')[1].split('?')[0].split('&')[0];
 else if(url.includes('v=')) id=url.split('v=')[1].split('&')[0];
 else if(url.includes('embed/')) id=url.split('embed/')[1].split('?')[0];
 else if(url.includes('shorts/')) id=url.split('shorts/')[1].split('?')[0];
 else if(url.length===11 && !url.includes(' ')) id=url;
 else id=url.split('/').pop().split('?')[0].split('&')[0];
 id=id.trim(); if(!id||id.length<8) return '';
 return `<iframe width="100%" height="250" src="https://www.youtube.com/embed/${id}?controls=1&rel=0&modestbranding=1&playsinline=1" frameborder="0" allowfullscreen style="border-radius:12px;background:#000;display:block"></iframe>`;
}
// ✅ 4 COURSES ONLY
const FIXED=[
  {title:'General English',ch:'English A1-B2 - Speaking, Grammar, Vocabulary',icon:'🇬🇧',vid:'',h5p:''},
  {title:'Legal English',ch:'Law Vocabulary - Contracts, Court, Legal Writing',icon:'⚖️',vid:'',h5p:''},
  {title:'Business English',ch:'Meetings, Emails, Negotiations, Presentations',icon:'💼',vid:'',h5p:''},
  {title:'Medical English',ch:'Hospital Vocabulary - Doctor, Nurse, Patient',icon:'🩺',vid:'',h5p:''}
];
let ALL=FIXED;
function getUnlocked(){ try{return JSON.parse(localStorage.getItem('ISOMERO_UNLOCKED_1KEY')||'{}')}catch(e){return {}} }
function formatDate(ts){ return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function daysLeft(exp){ return Math.ceil((exp - Date.now())/86400000); }

// STUDENT ENTER KEY
window.tryKey = async function(title, inputId, nameId){
  let key=document.getElementById(inputId).value.trim().toUpperCase();
  let studentName=document.getElementById(nameId).value.trim();
  if(!studentName) return alert('Enter your Full Name first');
  if(!key) return alert('Enter Enrolment Key');
  try{
    let ref=doc(db,'enrolmentKeys',key);
    let snap=await getDoc(ref);
    if(!snap.exists()){ alert('❌ Key not found.'); render(); return; }
    let data=snap.data();
    if(data.course!==title){ alert('❌ This key is for '+data.course+', not '+title); render(); return; }
    if(data.expiresAt && Date.now() > data.expiresAt){ alert('⏰ Expired on '+formatDate(data.expiresAt)+'. Ask Admin to RENEW.'); render(); return; }
    if(data.startAt && Date.now() < data.startAt){ alert('⏳ Starts on '+formatDate(data.startAt)); render(); return; }
    if(data.used && data.deviceId && data.deviceId!==myDeviceId){ alert('❌ Already used by another phone. 1 Key = 1 Course = 1 User.'); render(); return; }
    if(data.used && data.deviceId===myDeviceId){
      let u=getUnlocked(); u[title]=key; localStorage.setItem('ISOMERO_UNLOCKED_1KEY',JSON.stringify(u));
      alert('✅ Already unlocked. Period: '+formatDate(data.startAt)+' → '+formatDate(data.expiresAt)+' ('+daysLeft(data.expiresAt)+' days left)'); render(); return;
    }
    await updateDoc(ref,{ used:true, deviceId:myDeviceId, studentName:studentName, usedAt: Date.now() });
    let u=getUnlocked(); u[title]=key; localStorage.setItem('ISOMERO_UNLOCKED_1KEY',JSON.stringify(u));
    alert('✅ Unlocked! '+title+' for '+studentName+'\n📅 '+formatDate(data.startAt)+' → '+formatDate(data.expiresAt)+' ('+daysLeft(data.expiresAt)+' days left)');
    render();
  }catch(e){ alert('❌ Firebase Error: '+e.message+'\n\nDid you publish Firestore Rules?'); render(); }
}

// ADMIN GENERATE KEY + PERIOD
window.generateKey = async function(){
  let course=document.getElementById('genCourse').value;
  let student=document.getElementById('genStudent').value.trim();
  let startVal=document.getElementById('genStart').value;
  let endVal=document.getElementById('genEnd').value;
  let duration=document.getElementById('genDuration').value;
  if(!student) return alert('Enter Student Name');
  let startAt, expiresAt;
  if(startVal && endVal){ startAt=new Date(startVal).getTime(); expiresAt=new Date(endVal).getTime()+86399999; }
  else if(duration){ startAt=Date.now(); expiresAt=Date.now()+parseInt(duration)*86400000; }
  else return alert('Set Period: Start+End OR Duration');
  if(expiresAt<=startAt) return alert('End must be after Start');
  let prefix=course.split(' ')[0].toUpperCase();
  let code=Math.random().toString(36).substring(2,7).toUpperCase();
  let key=prefix+'-'+code;
  try{
    await setDoc(doc(db,'enrolmentKeys',key),{ course, studentName:student, used:false, deviceId:'', createdAt:Date.now(), startAt, expiresAt, durationDays: Math.ceil((expiresAt-startAt)/86400000) });
    document.getElementById('generatedKey').innerHTML=`<div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;font-weight:800;text-align:center">✅ KEY FOR ${student} - ${course}<br><span style="font-size:22px;letter-spacing:2px">${key}</span><br>📅 ${formatDate(startAt)} → ${formatDate(expiresAt)}<br><button class="btn-dark" style="margin-top:8px" onclick="navigator.clipboard.writeText('${key}');alert('Copied')">📋 Copy Key</button></div>`;
    render();
  }catch(e){ alert('Error: '+e.message); }
}

// ✅ ADMIN RENEW / EXTEND KEY - THIS WAS MISSING BEFORE
window.renewKey = async function(){
  let key=document.getElementById('renewKeyInput').value.trim().toUpperCase();
  let extraDays=document.getElementById('renewDays').value;
  if(!key) return alert('Enter Key to Renew');
  if(!extraDays) return alert('Select extra days');
  try{
    let ref=doc(db,'enrolmentKeys',key);
    let snap=await getDoc(ref);
    if(!snap.exists()){ alert('❌ Key not found'); return; }
    let data=snap.data();
    let oldExp=data.expiresAt||Date.now();
    let base = oldExp > Date.now() ? oldExp : Date.now();
    let newExp = base + parseInt(extraDays)*86400000;
    await updateDoc(ref,{ expiresAt:newExp, renewedAt:Date.now() });
    alert('✅ RENEWED!\nKey: '+key+'\nCourse: '+data.course+'\nStudent: '+data.studentName+'\nOld Expiry: '+formatDate(oldExp)+'\nNew Expiry: '+formatDate(newExp)+'\nStudent just needs to reopen app.html - it will unlock again.');
    render();
  }catch(e){ alert('Renew Error: '+e.message); }
}

window.adminAdd = function(){
  let t=document.getElementById('adminTitle').value.trim();
  let v=document.getElementById('adminVid').value.trim();
  let h=document.getElementById('adminH5p').value.trim();
  if(!t) return alert('Titre requis');
  ALL.forEach(c=>{if(c.title.toLowerCase()===t.toLowerCase()){if(v) c.vid=v; if(h) c.h5p=h;}});
  alert('✅ Sauvé'); render();
}

async function getExpiryInfo(title){
  let u=getUnlocked(); let key=u[title]; if(!key) return null;
  try{ let snap=await getDoc(doc(db,'enrolmentKeys',key)); if(snap.exists()) return snap.data(); }catch(e){}
  return null;
}

async function render(){
  let html='';
  let today=new Date().toISOString().split('T')[0];
  html+=`<div class="card" style="border:2px solid #ffcc00;background:#1a1600"><b>🔐 Admin – Generate Key + Set Period</b><br><small style="color:#8b93b8">Device: ${myDeviceId} • Firebase: ${firebaseConfig.projectId}</small><input id="genStudent" placeholder="Student Full Name"><select id="genCourse"><option>General English</option><option>Legal English</option><option>Business English</option><option>Medical English</option></select><b style="font-size:12px">📅 Period – Method 1: Start + End</b><div style="display:flex;gap:6px"><input type="date" id="genStart" value="${today}" style="flex:1"><input type="date" id="genEnd" style="flex:1"></div><b style="font-size:12px">OR Method 2: Duration</b><select id="genDuration"><option value="">-- Select Duration --</option><option value="7">7 Days</option><option value="30" selected>30 Days – 1 Month</option><option value="60">60 Days</option><option value="90">90 Days</option><option value="180">180 Days</option></select><button class="btn-gold" onclick="generateKey()">🔑 Generate Key + Period</button><div id="generatedKey"></div><hr style="border-color:#1e2540"><b>🔄 Admin – RENEW / EXTEND Expired Key</b><br><small style="color:#8b93b8">If course expired, enter same key here to extend - student does NOT need new key</small><input id="renewKeyInput" placeholder="Enter Existing Key ex: LEGAL-7K9X2"><select id="renewDays"><option value="30" selected>+30 Days</option><option value="7">+7 Days</option><option value="60">+60 Days</option><option value="90">+90 Days</option></select><button class="btn-green" onclick="renewKey()">🔄 Renew This Key</button><hr style="border-color:#1e2540"><b>📹 Admin – Add Video + H5P</b><input id="adminTitle" placeholder="Titre exact ex: Legal English"><input id="adminVid" placeholder="YouTube link"><input id="adminH5p" placeholder="H5P embed link"><button class="btn-gold" onclick="adminAdd()">💾 Sauver Vidéo + H5P</button></div>`;
  let unlocked=getUnlocked();
  for(let i=0;i<ALL.length;i++){
    let c=ALL[i];
    let hasH5p=c.h5p?' 🧩H5P':'';let hasVid=c.vid?' 📹YT':'';
    let isU=!!unlocked[c.title];
    let safe=c.title.replace(/[^a-zA-Z0-9]/g,'');
    let periodHtml='';
    if(isU){
      let info=await getExpiryInfo(c.title);
      if(info && info.expiresAt){
        let left=daysLeft(info.expiresAt);
        if(left<0){ periodHtml=`<br><span class="badge lock">⏰ EXPIRED ${formatDate(info.expiresAt)} - Ask Admin to RENEW</span>`; }
        else if(left<=7) periodHtml=`<br><span class="badge warn">⏳ ${left} days left – Expires ${formatDate(info.expiresAt)}</span>`;
        else periodHtml=`<br><span class="badge ok">📅 ${formatDate(info.startAt)} → ${formatDate(info.expiresAt)} • ${left} days left</span>`;
      }
    }
    html+=`<div class="card"><b><span style="font-size:20px">${c.icon}</span> ${c.title}</b> <span class="badge ${isU?'ok':'lock'}">${isU?'✅ UNLOCKED':'🔒 LOCKED'}</span> <small>${hasVid}${hasH5p}</small>${periodHtml}<br><small style="color:#8b93b8">${c.ch}</small><br>`;
    if(isU) html+=`<button class="btn-dark" onclick="openCourse(${i})">📹 Ouvrir Cours + H5P</button><small style="color:#00ff88">Key: ${unlocked[c.title]} • Device: ${myDeviceId}</small>`;
    else html+=`<div class="keybox"><b>🔑 Enrolment for ${c.title}</b><input id="name_${safe}" placeholder="Your Full Name"><input id="key_${safe}" placeholder="Enter Key ex: LEGAL-7K9X2"><button class="btn-gold" onclick="tryKey('${c.title}','key_${safe}','name_${safe}')">🔓 Unlock This Course</button><small style="color:#8b93b8">1 Key = 1 Course = 1 Phone • Period set by Admin • <a href="https://wa.me/25762706404?text=Enrolment Key for ${encodeURIComponent(c.title)}" target="_blank" style="color:#ffcc00">Request Key</a></small></div>`;
    html+=`</div>`;
  }
  document.getElementById('list').innerHTML=html;
}
window.openCourse=function(idx){
  let c=ALL[idx];
  if(!getUnlocked()[c.title]) return alert('🔒 Enter Key first');
  document.getElementById('playerBox').classList.add('open');
  document.getElementById('player').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${c.icon} ${c.title}</b><button onclick="closePlayer()" style="width:auto;padding:8px 14px;background:#fff;color:#000;border-radius:10px">✕ Fermer</button></div><div style="font-size:11px;color:#8b93b8;margin:6px 0">ISOMERO • Key Verified • Device ${myDeviceId}</div><div id="pluginBox"></div>`;
  let b=document.getElementById('pluginBox');
  let embed=youtubeEmbedder(c.vid);
  if(c.vid) b.innerHTML+=`<div class="q" style="background:#000;padding:0;overflow:hidden">${embed}</div>`;
  if(c.h5p) b.innerHTML+=`<div class="q" style="background:#000;padding:0;overflow:hidden;border:2px solid #4f46e5"><div style="padding:8px 12px;background:#4f46e5"><b style="color:#fff">🧩 H5P – ${c.title}</b></div><iframe src="${c.h5p}" width="100%" height="460" frameborder="0" allowfullscreen style="background:#fff;display:block;border:none"></iframe></div>`;
  else b.innerHTML+=`<div class="q"><b>🧩 H5P – ${c.title}</b><p style="color:#8b93b8">No H5P yet</p></div>`;
}
window.closePlayer=function(){document.getElementById('playerBox').classList.remove('open');}
render();
</script></body></html>
