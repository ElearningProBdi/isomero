<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOMERO - Certificate</title>
<script src="js/gunits.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#0a0e1f;margin:0;padding:15px}
.box{max-width:700px;margin:auto;background:white;padding:0;border-radius:15px;overflow:hidden}
.top-bar{background:#0a0e1f;color:white;text-align:center;padding:18px}
.top-bar h1{margin:0;font-size:26px;color:#ffcc00}
.top-bar p{margin:6px 0 0;color:#cbd5e1;font-size:13px}
.cert-body{padding:28px 24px;text-align:center;background:#fff}
.badge{display:inline-block;background:#fef9c3;color:#111;padding:6px 14px;border-radius:99px;font-weight:800;font-size:12px}
h2{font-size:15px;color:#64748b;margin:18px 0 4px;letter-spacing:2px}
.student{font-size:32px;font-weight:900;color:#0a0e1f;margin:4px 0}
.course{font-size:20px;font-weight:800;color:#1a73e8;margin:6px 0}
.level{font-size:16px;color:#333;margin:4px 0}
.score-box{display:flex;gap:12px;justify-content:center;margin:18px 0}
.score-item{background:#f4f6fb;border-radius:12px;padding:12px 18px;text-align:center}
.score-item b{font-size:22px;display:block}
.score-item span{font-size:12px;color:#64748b}
.code{font-family:monospace;background:#0a0e1f;color:#ffcc00;padding:10px 14px;border-radius:10px;display:inline-block;font-size:14px;letter-spacing:1px;margin:10px 0}
.sign{display:flex;justify-content:space-between;margin-top:28px;text-align:left;font-size:13px;color:#333}
.sign div{border-top:2px solid #111;padding-top:6px;width:42%}
.footer{background:#f4f6fb;padding:14px;text-align:center;font-size:12px;color:#64748b}
button{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin:8px 0}
.btn-print{background:#ffcc00;color:#000}
.btn-wa{background:#25D366;color:white}
.btn-home{background:#1e2540;color:white}
@media print{
  body{background:white;padding:0}
  .no-print{display:none!important}
  .box{box-shadow:none;border:2px solid #111}
}
</style>
</head>
<body>
<div class="box" id="certBox
