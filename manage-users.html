<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISOMERO - Manage Users</title><style>
body{margin:0;background:#0a0e1f;color:#eef;font-family:system-ui;padding:8px}
.card{background:#131a36;border:1px solid #1e2540;border-radius:14px;padding:12px;margin:10px 0}
button{border:none;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer;margin:2px;font-size:12px}.btn-gold{background:#ffcc00;color:#000}.btn-dark{background:#fff;color:#000}.btn-green{background:#00ff88;color:#000}.btn-red{background:#ff2a5a;color:#fff}.btn-grey{background:#333;color:#fff}
select,input{background:#0f1326;color:#fff;border:1px solid #1e2540;padding:10px;border-radius:10px;width:100%;margin:4px 0}
.badge{font-size:11px;padding:4px 8px;border-radius:99px;display:inline-block}.ok{background:#00ff88;color:#000;font-weight:800}.lock{background:#ff2a5a;color:#fff;font-weight:800}.warn{background:#ffcc00;color:#000;font-weight:800}.grey{background:#555;color:#fff;font-weight:800}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #1e2540;position:sticky;top:0;background:#0a0e1f;z-index:10}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #1e2540;text-align:left;vertical-align:top}
.search{position:sticky;top:55px;background:#0a0e1f;padding:8px 0;z-index:9}
</style></head><body>
<div class="header"><b>ISOMERO - MANAGE USERS</b><span id="fbStatus" style="font-size:11px;color:#ffcc00">⏳ Connecting...</span></div>

<div class="card" style="border:2px solid #ffcc00;background:#1a1600">
<b>🔐 Generate New Key + Period</b>
<input id="genStudent" placeholder="Student Full Name ex: Jean Pierre">
<select id="genCourse"><option>General English</option><option>Legal English</option><option>Business English</option><option>Medical English</option></select>
<b style="font-size:12px">📅 Period</b>
<div style="display:flex;gap:6px"><input type="date" id="genStart" style="flex:1"><input type="date" id="genEnd" style="flex:1"></div>
<select id="genDuration"><option value="">-- OR Duration --</option><option value="7">7 Days</option><option value="30" selected>30 Days</option><option value="60">60 Days</option><option value="90">90 Days</option><option value="180">180 Days</option></select>
<button class="btn-gold" onclick="generateKey()">🔑 Generate Key</button>
<div id="generatedKey"></div>
</div>

<div class="search">
<div style="display:flex;gap:6px">
<input id="searchInput" placeholder="🔍 Search Name / Key / Course..." oninput="renderList()" style="flex:2">
<select id="filterCourse" onchange="renderList()" style="flex:1"><option value="">All Courses</option><option>General English</option><option>Legal English</option><option>Business English</option><option>Medical English</option></select>
<select id="filterStatus" onchange="renderList()" style="flex:1"><option value="">All Status</option><option value="active">✅ Active</option><option value="expired">⏰ Expired</option><option value="notused">🕐 Not Used Yet</option><option value="revoked">🚫 Revoked</option></select>
</div>
<button class="btn-dark" onclick="loadUsers()">🔄 Refresh List</button>
</div>

<div id="stats" style="display:flex;gap:6px;flex-wrap:wrap"></div>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== ✅ FIREBASE CONFIG - SAME AS app.html =====
const firebaseConfig = {
  apiKey: "AIzaSyCAgHa3qAim81fVuAEjy6SDW8C3tEX60jk",
  authDomain: "isomero-f6887.firebaseapp.com",
  projectId: "isomero-f6887",
  storageBucket: "isomero-f6887.appspot.com",
  messagingSenderId: "109876543210",
  appId: "1:109876543210:web:isomero123456"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById('fbStatus').innerText = "✅ " + firebaseConfig.projectId;
document.getElementById('fbStatus').style.color = "#00ff88";
document.getElementById('genStart').value = new Date().toISOString().split('T')[0];

function formatDate(ts){ if(!ts) return '-'; return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function daysLeft(exp){ if(!exp) return 999; return Math.ceil((exp - Date.now())/86400000); }

let allKeys = [];

window.loadUsers = async function(){
  document.getElementById('list').innerHTML = '<p>⏳ Loading users...</p>';
  try{
    let snap = await getDocs(collection(db,'enrolmentKeys'));
    allKeys = [];
    snap.forEach(d=>{ allKeys.push({key:d.id, ...d.data()}); });
    allKeys.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    renderList();
  }catch(e){ document.getElementById('list').innerHTML = '❌ Error: '+e.message+'<br>Check Firestore Rules'; }
}

window.renderList = function(){
  let q = document.getElementById('searchInput').value.toLowerCase();
  let fc = document.getElementById('filterCourse').value;
  let fs = document.getElementById('filterStatus').value;
  let filtered = allKeys.filter(k=>{
    if(fc && k.course!==fc) return false;
    if(q && !((k.studentName||'').toLowerCase().includes(q) || k.key.toLowerCase().includes(q) || (k.course||'').toLowerCase().includes(q))) return false;
    if(fs==='active' && !(k.used && !k.revoked && daysLeft(k.expiresAt)>=0)) return false;
    if(fs==='expired' && !(daysLeft(k.expiresAt)<0)) return false;
    if(fs==='notused' && k.used) return false;
    if(fs==='revoked' && !k.revoked) return false;
    return true;
  });

  let active = allKeys.filter(k=>k.used && !k.revoked && daysLeft(k.expiresAt)>=0).length;
  let expired = allKeys.filter(k=>daysLeft(k.expiresAt)<0).length;
  let notused = allKeys.filter(k=>!k.used).length;
  let revoked = allKeys.filter(k=>k.revoked).length;
  document.getElementById('stats').innerHTML = `
    <span class="badge ok">✅ Active: ${active}</span>
    <span class="badge lock">⏰ Expired: ${expired}</span>
    <span class="badge grey">🕐 Not Used: ${notused}</span>
    <span class="badge lock">🚫 Revoked: ${revoked}</span>
    <span class="badge" style="background:#fff;color:#000">👥 Total Keys: ${allKeys.length}</span>
  `;

  if(filtered.length===0){ document.getElementById('list').innerHTML = '<div class="card">No users found. Generate a key above.</div>'; return; }

  let html = '<div class="card" style="overflow:auto"><table><tr><th>Student</th><th>Course / Key</th><th>Period / Days Left</th><th>Device / Status</th><th>Actions</th></tr>';
  filtered.forEach(k=>{
    let left = daysLeft(k.expiresAt);
    let status = '';
    if(k.revoked) status = '<span class="badge lock">🚫 REVOKED</span>';
    else if(!k.used) status = '<span class="badge grey">🕐 NOT USED YET</span>';
    else if(left<0) status = '<span class="badge lock">⏰ EXPIRED</span>';
    else if(left<=7) status = '<span class="badge warn">⏳ '+left+' days left</span>';
    else status = '<span class="badge ok">✅ ACTIVE '+left+' days</span>';

    html += `<tr>
      <td><b>${k.studentName||'—'}</b><br><small style="color:#8b93b8">Created: ${formatDate(k.createdAt)}</small>${k.usedAt?`<br><small style="color:#00ff88">Used: ${formatDate(k.usedAt)}</small>`:''}</td>
      <td><b>${k.course}</b><br><span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:6px;font-weight:800">${k.key}</span><br><button class="btn-grey" onclick="navigator.clipboard.writeText('${k.key}');alert('Copied ${k.key}')">📋 Copy</button></td>
      <td>${formatDate(k.startAt)} → ${formatDate(k.expiresAt)}<br><small>${k.durationDays||''} days total</small></td>
      <td>${status}<br><small>Device: ${k.deviceId||'-'}</small></td>
      <td style="min-width:140px">
        <button class="btn-green" onclick="renewKey('${k.key}')">🔄 Renew +30d</button><br>
        <button class="btn-gold" onclick="extendCustom('${k.key}')">📅 Extend Custom</button><br>
        ${k.revoked
          ? `<button class="btn-dark" onclick="unrevokeKey('${k.key}')">✅ Un-Revoke</button><br>`
          : `<button class="btn-red" onclick="revokeKey('${k.key}')">🚫 Revoke / Block</button><br>`
        }
        <button class="btn-red" style="background:#550000" onclick="deleteKey('${k.key}')">🗑️ Delete</button>
      </td>
    </tr>`;
  });
  html += '</table></div>';
  document.getElementById('list').innerHTML = html;
}

window.generateKey = async function(){
  let course=document.getElementById('genCourse').value;
  let student=document.getElementById('genStudent').value.trim();
  let startVal=document.getElementById('genStart').value;
  let endVal=document.getElementById('genEnd').value;
  let duration=document.getElementById('genDuration').value;
  if(!student) return alert('Enter Student Name');
  let startAt, expiresAt;
  if(startVal && endVal){ startAt=new Date(startVal).getTime(); expiresAt=new Date(endVal).getTime()+86399999; }
  else if(duration){ startAt=Date.now(); expiresAt=Date.now()+parseInt(duration)*86400000; }
  else return alert('Set Period');
  let prefix=course.split(' ')[0].toUpperCase();
  let code=Math.random().toString(36).substring(2,7).toUpperCase();
  let key=prefix+'-'+code;
  try{
    await setDoc(doc(db,'enrolmentKeys',key),{ course, studentName:student, used:false, deviceId:'', createdAt:Date.now(), startAt, expiresAt, durationDays: Math.ceil((expiresAt-startAt)/86400000) });
    document.getElementById('generatedKey').innerHTML=`<div style="background:#00ff88;color:#000;padding:12px;border-radius:10px;font-weight:800;text-align:center">✅ ${student} - ${course}<br><span style="font-size:22px">${key}</span><br>📅 ${formatDate(startAt)} → ${formatDate(expiresAt)}<br><button class="btn-dark" onclick="navigator.clipboard.writeText('${key}');alert('Copied')">📋 Copy</button> <a href="https://wa.me/?text=ISOMERO Key for ${encodeURIComponent(course)}: ${key} - ${formatDate(startAt)} to ${formatDate(expiresAt)}" target="_blank"><button style="background:#25D366;color:#fff">💬 WhatsApp</button></a></div>`;
    loadUsers();
  }catch(e){ alert('Error: '+e.message); }
}

window.renewKey = async function(key){
  if(!confirm('Renew '+key+' +30 days?')) return;
  try{
    let snap=await getDoc(doc(db,'enrolmentKeys',key));
    let data=snap.data();
    let base = (data.expiresAt||0) > Date.now() ? data.expiresAt : Date.now();
    let newExp = base + 30*86400000;
    await updateDoc(doc(db,'enrolmentKeys',key),{ expiresAt:newExp, renewedAt:Date.now(), revoked:false });
    alert('✅ Renewed to '+formatDate(newExp));
    loadUsers();
  }catch(e){ alert(e.message); }
}

window.extendCustom = async function(key){
  let d=prompt('How many days to add to '+key+'? (e.g. 7, 30, 90)');
  if(!d) return;
  try{
    let snap=await getDoc(doc(db,'enrolmentKeys',key));
    let data=snap.data();
    let base = (data.expiresAt||0) > Date.now() ? data.expiresAt : Date.now();
    let newExp = base + parseInt(d)*86400000;
    await updateDoc(doc(db,'enrolmentKeys',key),{ expiresAt:newExp, renewedAt:Date.now() });
    alert('✅ Extended to '+formatDate(newExp));
    loadUsers();
  }catch(e){ alert(e.message); }
}

window.revokeKey = async function(key){
  if(!confirm('🚫 REVOKE '+key+'?\nStudent will be BLOCKED instantly, even if period not expired.')) return;
  try{ await updateDoc(doc(db,'enrolmentKeys',key),{ revoked:true, revokedAt:Date.now() }); alert('🚫 Revoked '+key); loadUsers(); }catch(e){ alert(e.message); }
}

window.unrevokeKey = async function(key){
  try{ await updateDoc(doc(db,'enrolmentKeys',key),{ revoked:false }); alert('✅ Un-revoked '+key); loadUsers(); }catch(e){ alert(e.message); }
}

window.deleteKey = async function(key){
  if(!confirm('🗑️ DELETE '+key+' forever?\nStudent will lose access.')) return;
  try{ await deleteDoc(doc(db,'enrolmentKeys',key)); alert('🗑️ Deleted'); loadUsers(); }catch(e){ alert(e.message); }
}

loadUsers();
</script></body></html>
