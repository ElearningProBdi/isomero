<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MyAdmin</title><style>body{font-family:Arial;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{background:#1e293b;padding:26px;border-radius:14px;width:90%;max-width:360px;text-align:center} input{width:100%;padding:11px;margin:8px 0;border-radius:8px;border:none} button{width:100%;padding:11px;background:#0d6efd;color:#fff;border:none;border-radius:8px} .hidden{display:none}</style></head><body><div class="box"><div id="login"><h2>🔐 MyAdmin</h2><input id="pwd" type="password" placeholder="Mot de passe"><button onclick="check()">Entrer</button><p id="err" style="color:#f87171"></p></div><div id="panel" class="hidden"><h2>✅ Connecté</h2><a href="index.html" style="color:#38bdf8">Voir site</a></div></div><script>const PASS="Isomero2026!";function check(){if(document.getElementById('pwd').value===PASS){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');}else{document.getElementById('err').innerText="Mauvais!"}}</script></body></html>
